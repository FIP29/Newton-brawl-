# Render's free plan puts the backend to sleep after 15 minutes without traffic, and waking it takes a
# minute or more (that's the "registering took 3-4 minutes" delay). Pinging the health endpoint every
# 10 minutes keeps it awake. One always-on free service uses ~744 of the 750 free instance hours a month.
#
# Set the repository variable BACKEND_URL (Settings → Secrets and variables → Actions → Variables) to
# point somewhere else; it defaults to the current deployment.
name: Keep backend warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /actuator/health
        env:
          URL: ${{ vars.BACKEND_URL || 'https://newton-brawl-api.onrender.com' }}
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$URL/actuator/health" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::warning::Backend did not answer 200 (it may still be starting)"
