spring:
  datasource:
    url: jdbc:h2:mem:nb_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  # H2 runs in MySQL mode, so it uses the MySQL migrations.
  flyway:
    locations: classpath:db/migration/mysql
  jpa:
    hibernate:
      ddl-auto: validate
newton-brawl:
  warmup:
    enabled: false   # tests start many contexts; the warm-up only matters on a real server
