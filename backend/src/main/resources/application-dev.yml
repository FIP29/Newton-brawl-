# Local development without MySQL: in-memory H2 running in MySQL compatibility mode.
spring:
  datasource:
    url: jdbc:h2:mem:newton_brawl;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
  # H2 runs in MySQL mode, so it uses the MySQL migrations.
  flyway:
    locations: classpath:db/migration/mysql
