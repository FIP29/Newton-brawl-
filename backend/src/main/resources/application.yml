# Default profile = MySQL or PostgreSQL (from DB_URL). Use `--spring.profiles.active=dev` for a zero-setup H2 database.
server:
  port: ${PORT:8080}   # hosting platforms (Railway, Render, Fly…) pass the port in PORT
  # Behind a platform's HTTPS proxy: trust X-Forwarded-* so redirects and URLs use https.
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml

spring:
  application:
    name: newton-brawl
  autoconfigure:
    # Players sign in with JWTs; Spring's default in-memory user is never used (and costs startup time).
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/newton_brawl?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:newton}
    password: ${DB_PASSWORD:newton}
    hikari:
      # Hosted databases (e.g. Supabase's free plan) limit connections; a few are plenty for this game.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Tests validate the entities against it; production skips the check to start faster.
      ddl-auto: ${DDL_AUTO:none}
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    # db/migration/mysql or db/migration/postgresql, picked from the database actually connected
    locations: classpath:db/migration/{vendor}

newton-brawl:
  jwt:
    # MUST be overridden in production (>= 32 bytes, base64 encoded).
    secret: ${JWT_SECRET:bmV3dG9uLWJyYXdsLWRldi1zZWNyZXQtY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tcGxlYXNl}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  match:
    countdown-ticks: 120   # "ROUND 1 — FIGHT!" intro (2 s)
    round-seconds: 99      # round clock
    reconnect-grace: 8s    # time to reconnect before forfeiting
    room-ttl: 15m          # unused rooms expire

management:
  endpoints:
    web:
      exposure:
        include: health,info
